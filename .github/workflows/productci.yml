name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: CI - Build, Healthcheck and CRUD Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src tests -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Create Docker resources
        run: |
          docker network create product-network
          docker volume create nammongodb_data

      - name: Build and start CI deployment
        run: docker compose up -d --build

      - name: Wait for CI container healthchecks
        run: |
          ready=false

          for attempt in {1..30}; do
            mongodb_status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              nammongodb)

            api_status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              product-api)

            echo "Attempt ${attempt}/30"
            echo "MongoDB health: ${mongodb_status}"
            echo "Product API health: ${api_status}"

            if [ "$mongodb_status" = "healthy" ] && \
               [ "$api_status" = "healthy" ]; then
              ready=true
              break
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "CI containers did not become healthy"
            docker compose ps
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/health

      - name: Run CRUD integration tests
        env:
          API_URL: http://127.0.0.1:3000
        run: npm test

      - name: Show CI container logs on failure
        if: failure()
        continue-on-error: true
        run: docker compose logs

      - name: Stop CI deployment
        if: always()
        run: |
          docker compose down || true
          docker volume rm nammongodb_data || true
          docker network rm product-network || true

  publish-image:
    name: CD - Publish Image to Docker Hub
    needs:
      - build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/product-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-local:
    name: Deploy - Local Docker Engine
    needs:
      - publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Add Docker CLI to PATH
        shell: cmd
        run: |
          echo C:\Users\Dang Tuan Khai\AppData\Local\Programs\DockerDesktop\resources\bin>>"%GITHUB_PATH%"
          "C:\Users\Dang Tuan Khai\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" version

      - name: Install test dependencies
        shell: cmd
        run: npm ci

      - name: Pull latest production image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose -f docker-compose-prod.yaml up -d --remove-orphans

      - name: Wait for production healthchecks
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ready = $false

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $mongodbStatus = (
              docker inspect `
                --format="{{.State.Health.Status}}" `
                nammongodb-prod
            ).Trim()

            $apiStatus = (
              docker inspect `
                --format="{{.State.Health.Status}}" `
                product-api-prod
            ).Trim()

            Write-Host "Attempt ${attempt}/30"
            Write-Host "MongoDB health: ${mongodbStatus}"
            Write-Host "Product API health: ${apiStatus}"

            if (
              $mongodbStatus -eq "healthy" -and
              $apiStatus -eq "healthy"
            ) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            docker compose -f docker-compose-prod.yaml ps
            docker compose -f docker-compose-prod.yaml logs
            throw "Production containers did not become healthy"
          }

      - name: Verify production health endpoint
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $response = Invoke-RestMethod `
            -Uri "http://127.0.0.1:3000/health"

          $response | ConvertTo-Json

          if ($response.status -ne "healthy") {
            throw "Product API health endpoint is unhealthy"
          }

      - name: Run production CRUD tests
        shell: cmd
        env:
          API_URL: http://127.0.0.1:3000
        run: npm test

      - name: Show production status
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose -f docker-compose-prod.yaml ps