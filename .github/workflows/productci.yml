name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: CI - Build, Healthcheck and CRUD Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src tests -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Create Docker resources
        run: |
          docker network create product-network
          docker volume create nammongodb_data

      - name: Build and start deployment
        run: docker compose up -d --build

      - name: Wait for Product API healthcheck
        run: |
          ready=false

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              ready=true
              break
            fi

            echo "Waiting for Product API: attempt ${attempt}/30"
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Product API did not become healthy"
            exit 1
          fi

      - name: Verify container healthchecks
        run: |
          mongodb_status=$(docker inspect --format='{{.State.Health.Status}}' nammongodb)
          api_status=$(docker inspect --format='{{.State.Health.Status}}' product-api)

          echo "MongoDB health: ${mongodb_status}"
          echo "Product API health: ${api_status}"

          test "$mongodb_status" = "healthy"
          test "$api_status" = "healthy"

      - name: Run CRUD integration tests
        env:
          API_URL: http://127.0.0.1:3000
        run: npm test

      - name: Show container logs on failure
        if: failure()
        continue-on-error: true
        run: docker compose logs

      - name: Stop CI deployment
        if: always()
        run: |
          docker compose down || true
          docker volume rm nammongodb_data || true
          docker network rm product-network || true

  publish-image:
    name: CD - Publish Image to Docker Hub
    needs:
      - build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/product-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max